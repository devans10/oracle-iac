---
# SOA INT domain group variables — apply to all soa_int_* host groups.

soa_domain_name: soa_int
soa_domain_home: "{{ oracle_config }}/soa_int"
soa_ms_group: soa_int_ms
soa_wsm_group: soa_int_wsm

# WLS Admin Server — first host in soa_int group is the Admin Server VM.
# The inventory has no soa_int_admin subgroup; all SOA INT hosts share one flat group.
admin_host: "{{ hostvars[groups['soa_int'][0]]['ansible_host'] | default(groups['soa_int'][0]) }}"
admin_port: 8101
admin_user: weblogic
admin_password: "{{ vault_wls_admin_password }}"

# JDBC datasources for wls-cluster-config
jdbc_datasources:
  - name: SOADataSource
    jndi_name: jdbc/SOADataSource
    url: "jdbc:oracle:thin:@//{{ soa_db_scan }}:{{ rac_listener_port }}/{{ soa_db_service_int }}"
    db_user: INT_SOAINFRA
    cluster: SOA-INT-CLUSTER
    max_capacity: "{{ jdbc_max_capacity_soa }}"
  - name: SOALocalTxDataSource
    jndi_name: jdbc/SOALocalTxDataSource
    url: "jdbc:oracle:thin:@//{{ soa_db_scan }}:{{ rac_listener_port }}/{{ soa_db_service_int }}"
    db_user: INT_SOAINFRA
    cluster: SOA-INT-CLUSTER
    max_capacity: "{{ jdbc_max_capacity_soa }}"
  - name: mds-soa
    jndi_name: jdbc/mds/MDS_LocalTxDataSource
    url: "jdbc:oracle:thin:@//{{ soa_db_scan }}:{{ rac_listener_port }}/{{ soa_db_service_int }}"
    db_user: INT_MDS
    cluster: SOA-INT-CLUSTER
    max_capacity: "{{ jdbc_max_capacity_soa }}"
  - name: OraSDPMDataSource
    jndi_name: jdbc/OraSDPMDataSource
    url: "jdbc:oracle:thin:@//{{ soa_db_scan }}:{{ rac_listener_port }}/{{ soa_db_service_int }}"
    db_user: INT_ORASDPM
    cluster: SOA-INT-CLUSTER
    max_capacity: "{{ jdbc_max_capacity_soa }}"

# WLS cluster JVM heap for wls-cluster-config
wls_clusters:
  - name: SOA-INT-CLUSTER
    heap_mb: "{{ wls_ms_heap_mb_soa }}"
  - name: WSM-INT-CLUSTER
    heap_mb: "{{ wls_ms_heap_mb_soa }}"

# BeyondTrust startup credential injection
bt_wls_domains:
  - domain_home: "{{ soa_domain_home }}"
    admin_url: "t3://{{ admin_host }}:{{ admin_port }}"
    admin_user: "{{ admin_user }}"
    system_name: "{{ inventory_hostname }}"
