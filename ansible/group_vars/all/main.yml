---
# Global variables — override in group_vars/<group>/main.yml or host_vars/<host>/main.yml
# Sensitive values belong in group_vars/all/vault.yml (Ansible Vault encrypted)

# --- Oracle Filesystem Layout ---
oracle_base: /u01/oracle
oracle_products: "{{ oracle_base }}/products"
oracle_config: "{{ oracle_base }}/config"
oracle_logs: "{{ oracle_base }}/logs"
oracle_stage: "{{ oracle_base }}/stage"

# --- OS Users ---
oracle_user: oracle
oracle_group: oinstall
cissys_user: cissys
cissys_group: cisusr

# --- Java ---
jdk_version: "21"
jdk_home: "{{ oracle_products }}/jdk{{ jdk_version }}"
java_home: "{{ jdk_home }}"

# --- WebLogic ---
wls_version: "14.1.1.0"
wls_home: "{{ oracle_products }}/wls{{ wls_version }}"
mw_home: "{{ wls_home }}"
nm_port: 5556
nm_type: SSH

# --- OUAF / CC&B / MDM ---
ouaf_version: "4.x"
ccb_version: "25.10"
mdm_version: "25.10"
splebase_ccb: "{{ oracle_base }}/ccb"
splebase_mdm: "{{ oracle_base }}/mdm"

# --- SOA Suite ---
soa_version: "12.2.1.4"
soa_home: "{{ oracle_products }}/soa{{ soa_version }}"

# --- OHS ---
ohs_version: "12.2.1.4"
ohs_home: "{{ oracle_products }}/ohs"
ohs_listen_port: 80
ohs_ssl_port: 443

# --- NFS mounts (minimal — only shared exchange points) ---
nfs_server: "nfs.company.internal"
nfs_batch_output: "{{ nfs_server }}:/exports/batch-output"
nfs_imd_ingest: "{{ nfs_server }}:/exports/imd-ingest"
nfs_soa_files: "{{ nfs_server }}:/exports/soa-files"
nfs_bip_output: "{{ nfs_server }}:/exports/bipublisher"
nfs_mount_batch: "{{ oracle_base }}/shared/batch-output"
nfs_mount_imd: "{{ oracle_base }}/shared/imd-ingest"
nfs_mount_soa: "{{ oracle_base }}/shared/soa-files"

# --- BeyondTrust PasswordSafe ---
bt_api_base_url: "https://passwordsafe.company.internal/BeyondTrust/api/public/v3"
bt_credential_script: "{{ playbook_dir }}/../../scripts/beyondtrust/get-credential.sh"
# bt_client_id and bt_client_secret come from vault.yml

# --- Entra ID SAML ---
entra_tenant_id: "{{ vault_entra_tenant_id }}"       # from vault.yml
entra_idp_metadata: "/u01/oracle/config/saml/entra-idp-metadata.xml"
saml_sp_base_url_ccb: "https://ccb.company.com"
saml_sp_base_url_mdm: "https://mdm.company.com"

# --- Oracle RAC / JDBC ---
ccb_db_scan: "ccb-scan.company.internal"
ccb_db_service: "CCB_OLTP"
ccb_db_service_batch: "CCB_BATCH"
mdm_db_scan: "mdm-scan.company.internal"
mdm_db_service: "MDM_ONLINE"
mdm_db_service_batch: "MDM_IMD"
soa_db_scan: "soa-scan.company.internal"
soa_db_service_int: SOA_INT
soa_db_service_if: SOA_IF
soa_db_service_web: SOA_WEB
soa_db_service_sgg: SOA_SGG
rac_listener_port: 1521
jdbc_min_pool: 10
jdbc_max_pool_web: 100
jdbc_max_pool_iws: 75
jdbc_max_pool_batch: 200

# --- Data Guard ---
dg_protection_mode: MAXAVAILABILITY
dg_observer_host: "dg-observer.company.internal"
