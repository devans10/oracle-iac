---
# SOA IF domain group variables — apply to all soa_if_* host groups.

soa_domain_name: soa_if
soa_domain_home: "{{ oracle_config }}/soa_if"
soa_ms_group: soa_if_ms
soa_wsm_group: soa_if_wsm

# WLS Admin Server — first host in soa_if_admin group is the Admin Server VM.
admin_host: "{{ hostvars[groups['soa_if_admin'][0]]['ansible_host'] | default(groups['soa_if_admin'][0]) }}"
admin_port: 8201
admin_user: weblogic
admin_password: "{{ vault_wls_admin_password }}"

# JDBC datasources for wls-cluster-config
jdbc_datasources:
  - name: SOADataSource
    jndi_name: jdbc/SOADataSource
    url: "jdbc:oracle:thin:@//{{ soa_db_scan }}:{{ rac_listener_port }}/{{ soa_db_service_if }}"
    db_user: IF_SOAINFRA
    cluster: SOA-IF-CLUSTER
    max_capacity: "{{ jdbc_max_capacity_soa }}"
  - name: SOALocalTxDataSource
    jndi_name: jdbc/SOALocalTxDataSource
    url: "jdbc:oracle:thin:@//{{ soa_db_scan }}:{{ rac_listener_port }}/{{ soa_db_service_if }}"
    db_user: IF_SOAINFRA
    cluster: SOA-IF-CLUSTER
    max_capacity: "{{ jdbc_max_capacity_soa }}"
  - name: mds-soa
    jndi_name: jdbc/mds/MDS_LocalTxDataSource
    url: "jdbc:oracle:thin:@//{{ soa_db_scan }}:{{ rac_listener_port }}/{{ soa_db_service_if }}"
    db_user: IF_MDS
    cluster: SOA-IF-CLUSTER
    max_capacity: "{{ jdbc_max_capacity_soa }}"
  - name: OraSDPMDataSource
    jndi_name: jdbc/OraSDPMDataSource
    url: "jdbc:oracle:thin:@//{{ soa_db_scan }}:{{ rac_listener_port }}/{{ soa_db_service_if }}"
    db_user: IF_ORASDPM
    cluster: SOA-IF-CLUSTER
    max_capacity: "{{ jdbc_max_capacity_soa }}"

# WLS cluster JVM heap for wls-cluster-config
wls_clusters:
  - name: SOA-IF-CLUSTER
    heap_mb: "{{ wls_ms_heap_mb_soa }}"
  - name: WSM-IF-CLUSTER
    heap_mb: "{{ wls_ms_heap_mb_soa }}"

# BeyondTrust startup credential injection
bt_wls_domains:
  - domain_home: "{{ soa_domain_home }}"
    admin_url: "t3://{{ admin_host }}:{{ admin_port }}"
    admin_user: "{{ admin_user }}"
    system_name: "{{ inventory_hostname }}"
