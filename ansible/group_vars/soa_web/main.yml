---
# SOA WEB domain group variables — apply to all soa_web_* host groups.

soa_domain_name: soa_web
soa_domain_home: "{{ oracle_config }}/soa_web"
soa_osb_group: soa_web_osb
soa_ms_group: soa_web_soa
soa_bam_group: soa_web_bam
soa_wsm_group: soa_web_wsm

admin_host: "{{ hostvars[groups['soa_web_adm'][0]]['ansible_host'] | default(groups['soa_web_adm'][0]) }}"
admin_port: 8041
admin_user: weblogic
admin_password: "{{ vault_wls_admin_password }}"

jdbc_datasources:
  - name: SOADataSource
    jndi_name: jdbc/SOADataSource
    url: "jdbc:oracle:thin:@//{{ soa_db_scan }}:{{ rac_listener_port }}/{{ soa_db_service_web }}"
    db_user: WEB_SOAINFRA
    db_password: "{{ vault_soa_db_password }}"
    cluster: WEB-SOA-CLUSTER
    max_capacity: "{{ jdbc_max_capacity_soa }}"
  - name: SOALocalTxDataSource
    jndi_name: jdbc/SOALocalTxDataSource
    url: "jdbc:oracle:thin:@//{{ soa_db_scan }}:{{ rac_listener_port }}/{{ soa_db_service_web }}"
    db_user: WEB_SOAINFRA
    db_password: "{{ vault_soa_db_password }}"
    cluster: WEB-SOA-CLUSTER
    max_capacity: "{{ jdbc_max_capacity_soa }}"
  - name: mds-soa
    jndi_name: jdbc/mds/MDS_LocalTxDataSource
    url: "jdbc:oracle:thin:@//{{ soa_db_scan }}:{{ rac_listener_port }}/{{ soa_db_service_web }}"
    db_user: WEB_MDS
    db_password: "{{ vault_soa_db_password }}"
    cluster: WEB-SOA-CLUSTER
    max_capacity: "{{ jdbc_max_capacity_soa }}"
  - name: OraSDPMDataSource
    jndi_name: jdbc/OraSDPMDataSource
    url: "jdbc:oracle:thin:@//{{ soa_db_scan }}:{{ rac_listener_port }}/{{ soa_db_service_web }}"
    db_user: WEB_ORASDPM
    db_password: "{{ vault_soa_db_password }}"
    cluster: WEB-SOA-CLUSTER
    max_capacity: "{{ jdbc_max_capacity_soa }}"

wls_clusters:
  - name: WEB-OSB-CLUSTER
    heap_mb: "{{ wls_ms_heap_mb_soa }}"
  - name: WEB-SOA-CLUSTER
    heap_mb: "{{ wls_ms_heap_mb_soa }}"
  - name: WEB-BAM-CLUSTER
    heap_mb: "{{ wls_ms_heap_mb_soa }}"
  - name: WEB-WSM-CLUSTER
    heap_mb: "{{ wls_ms_heap_mb_soa }}"

bt_wls_domains:
  - domain_home: "{{ soa_domain_home }}"
    admin_url: "t3://{{ admin_host }}:{{ admin_port }}"
    admin_user: "{{ admin_user }}"
    system_name: "{{ inventory_hostname }}"
