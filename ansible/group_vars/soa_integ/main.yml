---
# SOA INTEG domain group variables — apply to all soa_integ_* host groups.

soa_domain_name: soa_integ
soa_domain_home: "{{ oracle_config }}/soa_integ"
soa_osb_group: soa_integ_osb
soa_ms_group: soa_integ_soa
soa_wsm_group: soa_integ_wsm

admin_host: "{{ hostvars[groups['soa_integ_adm'][0]]['ansible_host'] | default(groups['soa_integ_adm'][0]) }}"
admin_port: 8001
admin_user: weblogic
admin_password: "{{ vault_wls_admin_password }}"

jdbc_datasources:
  - name: SOADataSource
    jndi_name: jdbc/SOADataSource
    url: "jdbc:oracle:thin:@//{{ soa_db_scan }}:{{ rac_listener_port }}/{{ soa_db_service_integ }}"
    db_user: INTEG_SOAINFRA
    db_password: "{{ vault_soa_db_password }}"
    cluster: INTEG-SOA-CLUSTER
    max_capacity: "{{ jdbc_max_capacity_soa }}"
  - name: SOALocalTxDataSource
    jndi_name: jdbc/SOALocalTxDataSource
    url: "jdbc:oracle:thin:@//{{ soa_db_scan }}:{{ rac_listener_port }}/{{ soa_db_service_integ }}"
    db_user: INTEG_SOAINFRA
    db_password: "{{ vault_soa_db_password }}"
    cluster: INTEG-SOA-CLUSTER
    max_capacity: "{{ jdbc_max_capacity_soa }}"
  - name: mds-soa
    jndi_name: jdbc/mds/MDS_LocalTxDataSource
    url: "jdbc:oracle:thin:@//{{ soa_db_scan }}:{{ rac_listener_port }}/{{ soa_db_service_integ }}"
    db_user: INTEG_MDS
    db_password: "{{ vault_soa_db_password }}"
    cluster: INTEG-SOA-CLUSTER
    max_capacity: "{{ jdbc_max_capacity_soa }}"
  - name: OraSDPMDataSource
    jndi_name: jdbc/OraSDPMDataSource
    url: "jdbc:oracle:thin:@//{{ soa_db_scan }}:{{ rac_listener_port }}/{{ soa_db_service_integ }}"
    db_user: INTEG_ORASDPM
    db_password: "{{ vault_soa_db_password }}"
    cluster: INTEG-SOA-CLUSTER
    max_capacity: "{{ jdbc_max_capacity_soa }}"

wls_clusters:
  - name: INTEG-OSB-CLUSTER
    heap_mb: "{{ wls_ms_heap_mb_soa }}"
  - name: INTEG-SOA-CLUSTER
    heap_mb: "{{ wls_ms_heap_mb_soa }}"
  - name: INTEG-WSM-CLUSTER
    heap_mb: "{{ wls_ms_heap_mb_soa }}"

bt_wls_domains:
  - domain_home: "{{ soa_domain_home }}"
    admin_url: "t3://{{ admin_host }}:{{ admin_port }}"
    admin_user: "{{ admin_user }}"
    system_name: "{{ inventory_hostname }}"
