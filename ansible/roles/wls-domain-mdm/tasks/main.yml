---
# wls-domain-mdm — creates the WLS domain for MDM using WLST offline.
# Runs on mdm_admin host only. Idempotent: guarded by domain config.xml.

- name: Ensure WLST script staging directory exists
  ansible.builtin.file:
    path: "{{ wlst_script_dir }}"
    state: directory
    owner: "{{ oracle_user }}"
    group: "{{ oracle_group }}"
    mode: "0750"
  become: true
  tags: [configure]

- name: Check if MDM domain already exists
  ansible.builtin.stat:
    path: "{{ mdm_domain_home }}/config/config.xml"
  register: mdm_domain_exists
  tags: [configure]

- name: Generate MDM domain creation WLST script
  ansible.builtin.template:
    src: mdm-domain.py.j2
    dest: "{{ mdm_domain_script }}"
    owner: "{{ oracle_user }}"
    group: "{{ oracle_group }}"
    mode: "0640"
  become: true
  become_user: "{{ oracle_user }}"
  when: not mdm_domain_exists.stat.exists
  tags: [configure]

- name: Create MDM WLS domain
  ansible.builtin.command:
    cmd: "{{ wls_home }}/oracle_common/common/bin/wlst.sh {{ mdm_domain_script }}"
    creates: "{{ mdm_domain_home }}/config/config.xml"
  become: true
  become_user: "{{ oracle_user }}"
  environment:
    JAVA_HOME: "{{ java_home }}"
    MW_HOME: "{{ mw_home }}"
  register: mdm_domain_result
  changed_when: mdm_domain_result.rc == 0
  failed_when: mdm_domain_result.rc not in [0]
  when: not mdm_domain_exists.stat.exists
  tags: [configure]

- name: Verify MDM domain config.xml exists
  ansible.builtin.stat:
    path: "{{ mdm_domain_home }}/config/config.xml"
  register: mdm_domain_verify
  failed_when: not mdm_domain_verify.stat.exists
  changed_when: false
  tags: [validate]

- name: Pack MDM domain for distribution to managed servers
  ansible.builtin.command:
    cmd: >
      {{ wls_home }}/oracle_common/common/bin/pack.sh
      -domain={{ mdm_domain_home }}
      -template={{ oracle_stage }}/wlst/MDM_domain_template.jar
      -template_name="MDM Domain"
      -managed=true
    creates: "{{ oracle_stage }}/wlst/MDM_domain_template.jar"
  become: true
  become_user: "{{ oracle_user }}"
  environment:
    JAVA_HOME: "{{ java_home }}"
  tags: [configure]
