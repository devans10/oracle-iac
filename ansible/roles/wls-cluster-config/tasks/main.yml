---
# wls-cluster-config — configures JDBC data sources and JVM args via WLST online.
# Requires Admin Server to be running. Idempotent via WLST exists() checks in script.

- name: Generate cluster config WLST script
  ansible.builtin.template:
    src: cluster-config.py.j2
    dest: "{{ wlst_config_script }}"
    owner: "{{ oracle_user }}"
    group: "{{ oracle_group }}"
    mode: "0640"
  become: true
  become_user: "{{ oracle_user }}"
  tags: [configure]

- name: Wait for Admin Server to be reachable
  ansible.builtin.wait_for:
    host: "{{ admin_host }}"
    port: "{{ admin_port }}"
    timeout: 120
  tags: [configure]

- name: Run cluster config WLST script
  ansible.builtin.command:
    cmd: "{{ wls_home }}/oracle_common/common/bin/wlst.sh {{ wlst_config_script }}"
  become: true
  become_user: "{{ oracle_user }}"
  environment:
    JAVA_HOME: "{{ java_home }}"
    MW_HOME: "{{ mw_home }}"
  register: cluster_config_result
  changed_when: "'Configuration updated' in cluster_config_result.stdout"
  failed_when: cluster_config_result.rc not in [0]
  tags: [configure]
