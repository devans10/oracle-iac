---
# entra-id-saml/tasks/main.yml
# Configures WLS Security Realm to use Entra ID as SAML 2.0 IdP.
# Runs on the WLS Admin Server VM for CCB-WEB and MDM-WEB clusters only (ADR-003).

- name: Create SAML configuration directory
  tags: configure
  ansible.builtin.file:
    path: "{{ saml_config_dir }}"
    state: directory
    owner: "{{ oracle_user }}"
    group: "{{ oracle_group }}"
    mode: "0750"

- name: Create WLST staging directory
  tags: configure
  ansible.builtin.file:
    path: "{{ saml_wlst_dir }}"
    state: directory
    owner: "{{ oracle_user }}"
    group: "{{ oracle_group }}"
    mode: "0750"

- name: Stat cleaned Entra ID metadata file
  tags: configure
  ansible.builtin.stat:
    path: "{{ saml_metadata_clean }}"
  register: saml_metadata_clean_stat

- name: Strip RoleDescriptor elements from Entra ID metadata XML
  tags: configure
  when: not saml_metadata_clean_stat.stat.exists
  become: true
  become_user: "{{ oracle_user }}"
  ansible.builtin.shell:
    cmd: |
      python3 -c "
      import xml.etree.ElementTree as ET
      ET.register_namespace('', 'urn:oasis:names:tc:SAML:2.0:metadata')
      tree = ET.parse('{{ saml_idp_metadata_src }}')
      root = tree.getroot()
      ns = {'md': 'urn:oasis:names:tc:SAML:2.0:metadata'}
      # Remove all elements whose local tag name is RoleDescriptor
      for parent in list(root.iter()):
          to_remove = [
              child for child in list(parent)
              if child.tag.split('}')[-1] == 'RoleDescriptor'
          ]
          for elem in to_remove:
              parent.remove(elem)
      tree.write('{{ saml_metadata_clean }}',
                 xml_declaration=True,
                 encoding='UTF-8',
                 short_empty_elements=True)
      "
  register: saml_strip_result
  changed_when: saml_strip_result.rc == 0
  failed_when: saml_strip_result.rc != 0

- name: Copy cleaned metadata to canonical destination
  tags: configure
  ansible.builtin.copy:
    src: "{{ saml_metadata_clean }}"
    dest: "{{ saml_metadata_dest }}"
    remote_src: true
    owner: "{{ oracle_user }}"
    group: "{{ oracle_group }}"
    mode: "0640"

- name: Generate WLST SAML configuration script from template
  tags: configure
  become: true
  become_user: "{{ oracle_user }}"
  no_log: true
  ansible.builtin.template:
    src: configure-saml.py.j2
    dest: "{{ saml_configure_script }}"
    owner: "{{ oracle_user }}"
    group: "{{ oracle_group }}"
    mode: "0640"

- name: Wait for WLS Admin Server to be reachable
  tags: configure
  ansible.builtin.wait_for:
    host: "{{ admin_host }}"
    port: "{{ admin_port }}"
    timeout: 120

- name: Run WLST SAML configuration script
  tags: configure
  become: true
  become_user: "{{ oracle_user }}"
  no_log: true
  ansible.builtin.command:
    cmd: "{{ wls_home }}/oracle_common/common/bin/wlst.sh {{ saml_configure_script }}"
  environment:
    JAVA_HOME: "{{ java_home }}"
    DOMAIN_HOME: "{{ domain_home }}"
    WLS_ADMIN_USER: "{{ admin_user }}"
    WLS_ADMIN_PASSWORD: "{{ vault_wls_admin_password }}"
  register: saml_result
  changed_when: "'SAML Identity Asserter configured' in saml_result.stdout"
  failed_when: saml_result.rc != 0

- name: Verify SAML metadata file is present
  tags: validate
  ansible.builtin.stat:
    path: "{{ saml_metadata_dest }}"
  register: saml_metadata_dest_stat
  failed_when: not saml_metadata_dest_stat.stat.exists
