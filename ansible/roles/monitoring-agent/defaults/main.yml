---
node_exporter_version: "1.7.0"
node_exporter_rpm: "{{ media_base_path }}/monitoring/node_exporter-{{ node_exporter_version }}.linux-amd64.rpm"
node_exporter_service: prometheus-node-exporter
node_exporter_port: 9100
node_exporter_user: node_exporter
node_exporter_textfile_dir: /var/lib/node_exporter/textfile_collector

# Optional extra CLI flags passed to node_exporter.
# Example: "--collector.disable-defaults --collector.cpu"
node_exporter_extra_args: ""
