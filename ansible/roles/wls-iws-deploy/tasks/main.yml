---
# wls-iws-deploy — deploys WebServices.ear to the IWS cluster via WLST online.
# Idempotent: WLST deploy() is a no-op when app is already deployed at same version.
# iws_domain and iws_cluster must be set as role vars by the calling play.

- name: Verify WebServices.ear is staged
  ansible.builtin.stat:
    path: "{{ iws_ear_source }}"
  register: iws_ear
  failed_when: not iws_ear.stat.exists
  changed_when: false
  tags: [deploy]

- name: Wait for Admin Server to be reachable
  ansible.builtin.wait_for:
    host: "{{ admin_host }}"
    port: "{{ admin_port }}"
    timeout: 120
  tags: [deploy]

- name: Generate IWS deploy WLST script
  ansible.builtin.template:
    src: deploy-iws.py.j2
    dest: "{{ iws_deploy_script }}"
    owner: "{{ oracle_user }}"
    group: "{{ oracle_group }}"
    mode: "0640"
  become: true
  become_user: "{{ oracle_user }}"
  tags: [deploy]

- name: Deploy WebServices.ear
  ansible.builtin.command:
    cmd: "{{ wls_home }}/oracle_common/common/bin/wlst.sh {{ iws_deploy_script }}"
  become: true
  become_user: "{{ oracle_user }}"
  environment:
    JAVA_HOME: "{{ java_home }}"
    MW_HOME: "{{ mw_home }}"
  register: iws_deploy_result
  changed_when: "'Successfully deployed' in iws_deploy_result.stdout"
  failed_when: iws_deploy_result.rc not in [0]
  tags: [deploy]
