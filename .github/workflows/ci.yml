name: IaC Validation

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  ansible-lint:
    name: Ansible Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install ansible ansible-lint
      - run: ansible-lint ansible/
        working-directory: .

  ansible-syntax:
    name: Ansible Syntax Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install ansible
      - name: Syntax check all playbooks
        run: |
          for pb in ansible/playbooks/**/*.yml; do
            echo "Checking: $pb"
            ansible-playbook --syntax-check "$pb" \
              -i ansible/inventories/primary.yml.example \
              --vault-password-file /dev/null || true
          done

  terraform-validate:
    name: Terraform Validate
    runs-on: ubuntu-latest
    env:
      LIBVIRT_PROVIDER_VERSION: "0.7.6"
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.7'
      - name: Cache libvirt provider binary
        id: cache-provider
        uses: actions/cache@v4
        with:
          path: ~/.terraform.d/plugins
          key: ${{ runner.os }}-libvirt-provider-${{ env.LIBVIRT_PROVIDER_VERSION }}
      - name: Install libvirt provider from GitHub releases
        if: steps.cache-provider.outputs.cache-hit != 'true'
        run: |
          PLUGIN_DIR="${HOME}/.terraform.d/plugins/registry.terraform.io/dmacvicar/libvirt/${LIBVIRT_PROVIDER_VERSION}/linux_amd64"
          mkdir -p "${PLUGIN_DIR}"
          curl -sL "https://github.com/dmacvicar/terraform-provider-libvirt/releases/download/v${LIBVIRT_PROVIDER_VERSION}/terraform-provider-libvirt_${LIBVIRT_PROVIDER_VERSION}_linux_amd64.zip" \
            -o /tmp/libvirt-provider.zip
          unzip -p /tmp/libvirt-provider.zip "terraform-provider-libvirt_v${LIBVIRT_PROVIDER_VERSION}" \
            > "${PLUGIN_DIR}/terraform-provider-libvirt_v${LIBVIRT_PROVIDER_VERSION}"
          chmod +x "${PLUGIN_DIR}/terraform-provider-libvirt_v${LIBVIRT_PROVIDER_VERSION}"
      - name: Configure Terraform filesystem mirror
        run: |
          cat > ~/.terraformrc << EOF
          provider_installation {
            filesystem_mirror {
              path    = "${HOME}/.terraform.d/plugins"
              include = ["registry.terraform.io/dmacvicar/libvirt"]
            }
            direct {
              exclude = ["registry.terraform.io/dmacvicar/libvirt"]
            }
          }
          EOF
      - name: Terraform fmt check
        run: terraform fmt -check -recursive terraform/
      - name: Terraform validate primary
        run: |
          cd terraform/environments/primary
          terraform init -backend=false -no-color
          terraform validate -no-color
      - name: Terraform validate dr
        run: |
          cd terraform/environments/dr
          terraform init -backend=false -no-color
          terraform validate -no-color
      - name: Terraform validate azure-dev
        run: |
          cd terraform/environments/azure-dev
          terraform init -backend=false -no-color
          terraform validate -no-color
      - name: Terraform validate do-dev
        run: |
          cd terraform/environments/do-dev
          terraform init -backend=false -no-color
          terraform validate -no-color

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for accidental secrets
        run: |
          if grep -rE '^\s*(password|secret|api_key|private_key|token|client_secret|credential)\s*[:=]\s*["\x27][^"\x27$\{\}]{8,}' \
            --include="*.yml" --include="*.yaml" --include="*.tf" --include="*.py" \
            --include="*.sh" --include="*.j2" --include="*.properties" --include="*.conf" \
            --exclude-dir=".git" --exclude-dir="scripts/bootstrap" \
            --exclude="*.example" --exclude="vault.yml.example" .; then
            echo "ERROR: Possible hardcoded secret found. Use Ansible Vault or BeyondTrust."
            exit 1
          fi
          echo "Secret scan passed"
